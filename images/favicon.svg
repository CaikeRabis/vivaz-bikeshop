<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="256" cy="256" r="248"/>
    </clipPath>
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#0a0a0c"/>

  <!-- Inner bg gradient -->
  <circle cx="256" cy="256" r="248" fill="url(#bg-grad)" clip-path="url(#circle-clip)"/>

  <!-- Blue border ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#1e6fff" stroke-width="5" opacity="0.8"/>

  <!-- Bike silhouette arc (blue accent top-right, like the logo) -->
  <g clip-path="url(#circle-clip)" filter="url(#glow-blue)">
    <path d="M 285 105 Q 370 90 400 160 Q 420 210 380 240" 
          fill="none" stroke="#1e6fff" stroke-width="14" 
          stroke-linecap="round" opacity="0.9"/>
    <path d="M 310 100 L 330 88" 
          fill="none" stroke="#1e6fff" stroke-width="14" 
          stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- VIVAZ lettering -->
  <g clip-path="url(#circle-clip)">
    <!-- V -->
    <polygon points="85,195 115,195 145,265 175,195 205,195 155,300 135,300" fill="white"/>
    <!-- I -->
    <rect x="215" y="195" width="28" height="105" fill="white"/>
    <!-- V (second) -->
    <polygon points="253,195 283,195 313,265 343,195 373,195 323,300 303,300" fill="white"/>
    <!-- A -->
    <polygon points="385,300 415,300 450,195 420,195 400,255 380,195 350,195" fill="white"/>
    <!-- Z -->
    <polygon points="455,195 510,195 510,215 480,280 510,280 510,300 455,300 455,280 485,215 455,215" fill="white"/>
  </g>

  <!-- BIKE SHOP text -->
  <text x="256" y="345" 
        font-family="Arial, sans-serif" font-weight="700" font-size="36" 
        fill="white" text-anchor="middle" letter-spacing="8"
        clip-path="url(#circle-clip)">BIKE SHOP</text>

  <!-- Blue underline decorators -->
  <line x1="145" y1="322" x2="193" y2="322" stroke="#1e6fff" stroke-width="3" clip-path="url(#circle-clip)"/>
  <line x1="319" y1="322" x2="367" y2="322" stroke="#1e6fff" stroke-width="3" clip-path="url(#circle-clip)"/>
</svg>
